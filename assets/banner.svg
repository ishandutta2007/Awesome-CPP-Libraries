y=".25" stroke="#00d2ff" stroke-opacity=".6" stroke-width="1" rx="14"/><text x="14" y="19" fill="#00d2ff" class="mono-font" font-size="11" font-weight="700" letter-spacing="1.2">⚡ CURATED ECOSYSTEM</text></g><text x="0" y="142" fill="#fff" class="title-font" font-size="44">Awesome C++ Libraries</text><rect width="180" height="4" x="0" y="162" fill="url(#primary-grad)" rx="2"/><text x="0" y="202" fill="#e2e8f0" class="sub-font" font-size="20">Enterprise Frameworks, Cross-Platform Runtimes &amp; High-Performance Primitives</text><text x="0" y="235" fill="#94a3b8" class="sub-font" font-size="14">Battle-tested C++ building blocks: Boost, Qt, Abseil, Folly, nlohmann/json, Protobuf, POCO &amp; more.</text><g><g transform="translate(0, 272)"><rect width="92" height="26" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12" rx="6"/><text x="46" y="17" fill="#cbd5e1" class="mono-font" font-size="11" text-anchor="middle">C++20 / C++23</text></g><g transform="translate(0, 272) translate(102, 0)"><rect width="124" height="26" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12" rx="6"/><text x="62" y="17" fill="#cbd5e1" class="mono-font" font-size="11" text-anchor="middle">Cross-Platform</text></g><g transform="translate(0, 272) translate(236, 0)"><rect width="138" height="26" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12" rx="6"/><text x="69" y="17" fill="#cbd5e1" class="mono-font" font-size="11" text-anchor="middle">SaaS &amp; Open Source</text></g><g transform="translate(0, 272) translate(384, 0)"><rect width="110" height="26" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12" rx="6"/><text x="55" y="17" fill="#cbd5e1" class="mono-font" font-size="11" text-anchor="middle">High-Throughput</text></g></g></g></svg>