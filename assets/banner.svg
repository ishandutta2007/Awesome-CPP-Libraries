<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Animations -->
    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .orbit-spin-slow {
        animation: rotateOrb 22s linear infinite;
        transform-origin: 1050px 180px;
      }
      .orbit-spin-fast {
        animation: rotateOrb 12s linear infinite reverse;
        transform-origin: 1050px 180px;
      }
      .float-badge-1 {
        animation: floatBadge 5s ease-in-out infinite alternate;
      }
      .float-badge-2 {
        animation: floatBadge 6s ease-in-out 1.5s infinite alternate;
      }
      .float-badge-3 {
        animation: floatBadge 5.5s ease-in-out 3s infinite alternate;
      }
      .wave-flow {
        animation: waveShift 10s linear infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.97); }
        100% { opacity: 0.75; transform: scale(1.03); }
      }
      @keyframes rotateOrb {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes floatBadge {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-9px); }
      }
      @keyframes waveShift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-600px); }
      }
      .title-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .mono-font {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Ambient Glow Circles in Background (Behind Text) -->
  <g class="glow-pulse" style="transform-origin: 200px 180px;">
    <circle cx="150" cy="180" r="140" fill="#00d2ff" opacity="0.12" filter="blur(50px)" />
    <circle cx="950" cy="150" r="180" fill="#7928ca" opacity="0.15" filter="blur(60px)" />
  </g>

  <!-- Animated Background Wave / Flow Line -->
  <g opacity="0.18">
    <path class="wave-flow" d="M -600 300 Q -450 240, -300 300 T 0 300 T 300 300 T 600 300 T 900 300 T 1200 300 T 1500 300 T 1800 300" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="8 6" />
    <path class="wave-flow" d="M -600 320 Q -450 280, -300 320 T 0 320 T 300 320 T 600 320 T 900 320 T 1200 320 T 1500 320 T 1800 320" fill="none" stroke="#7928ca" stroke-width="2" stroke-dasharray="10 8" />
  </g>

  <!-- Animated Tech Rings on Right side (Well away from title/subtitle text) -->
  <g>
    <circle cx="1050" cy="180" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <circle cx="1050" cy="180" r="80" fill="none" stroke="#00d2ff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8 12" class="orbit-spin-slow" />
    <circle cx="1050" cy="180" r="50" fill="none" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 8" class="orbit-spin-fast" />
    
    <!-- Central C++ Core Emblem -->
    <circle cx="1050" cy="180" r="32" fill="#00599c" fill-opacity="0.35" stroke="#00d2ff" stroke-width="2" />
    <text x="1050" y="188" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20">C++</text>
  </g>

  <!-- Dynamic Floating Feature Badges on Right -->
  <g class="float-badge-1">
    <rect x="850" y="60" width="160" height="38" rx="19" fill="url(#card-grad)" stroke="#00d2ff" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="870" cy="79" r="5" fill="#00d2ff" />
    <text x="886" y="84" fill="#e0e6ed" class="mono-font" font-size="12" font-weight="600">Boost • Folly • Qt</text>
  </g>

  <g class="float-badge-2">
    <rect x="910" y="270" width="180" height="38" rx="19" fill="url(#card-grad)" stroke="#9d4edd" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="930" cy="289" r="5" fill="#9d4edd" />
    <text x="946" y="294" fill="#e0e6ed" class="mono-font" font-size="12" font-weight="600">SIMD • I/O • Concurrency</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Tag, Title, Subtitle (Guaranteed 100% visible and unhidden) -->
  <g transform="translate(70, 0)">
    
    <!-- Top Pill / Topic Tag -->
    <g transform="translate(0, 52)">
      <rect width="215" height="28" rx="14" fill="#0066cc" fill-opacity="0.25" stroke="#00d2ff" stroke-opacity="0.6" stroke-width="1" />
      <text x="14" y="19" fill="#00d2ff" class="mono-font" font-size="11" font-weight="700" letter-spacing="1.2">⚡ CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" fill="#ffffff" class="title-font" font-size="44">Awesome C++ Libraries</text>

    <!-- Subtitle Highlight Gradient Bar -->
    <rect x="0" y="162" width="180" height="4" rx="2" fill="url(#primary-grad)" />

    <!-- Subtitle Text -->
    <text x="0" y="202" fill="#e2e8f0" class="sub-font" font-size="20">
      Enterprise Frameworks, Cross-Platform Runtimes &amp; High-Performance Primitives
    </text>

    <text x="0" y="235" fill="#94a3b8" class="sub-font" font-size="14">
      Battle-tested C++ building blocks: Boost, Qt, Abseil, Folly, nlohmann/json, Protobuf, POCO &amp; more.
    </text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 272)">
      <!-- Pill 1 -->
      <g>
        <rect width="92" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="46" y="17" text-anchor="middle" fill="#cbd5e1" class="mono-font" font-size="11">C++20 / C++23</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(102, 0)">
        <rect width="124" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="62" y="17" text-anchor="middle" fill="#cbd5e1" class="mono-font" font-size="11">Cross-Platform</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(236, 0)">
        <rect width="138" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="69" y="17" text-anchor="middle" fill="#cbd5e1" class="mono-font" font-size="11">SaaS &amp; Open Source</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(384, 0)">
        <rect width="110" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="55" y="17" text-anchor="middle" fill="#cbd5e1" class="mono-font" font-size="11">High-Throughput</text>
      </g>
    </g>
  </g>
</svg>
