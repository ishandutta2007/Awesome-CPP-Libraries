<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06c"/><stop offset="50%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#3a7bd5"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="100%" y2="0%"><stop offset="0%" stop-color="#00d2ff" stop-opacity=".8"/><stop offset="100%" stop-color="#9d4edd" stop-opacity=".8"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><style>@keyframes pulse{0%{opacity:.35;transform:scale(.97)}}@keyframes floatBadge{0%{transform:translateY(0)}}@keyframes waveShift{0%{transform:translateX(0)}}.glow-pulse{animation:pulse 4s ease-in-out infinite alternate}.orbit-spin-fast,.orbit-spin-slow{transform-origin:1050px 180px}.orbit-spin-slow{animation:rotateOrb 22s linear infinite}.orbit-spin-fast{animation:rotateOrb 12s linear infinite reverse}.float-badge-1{animation:floatBadge 5s ease-in-out infinite alternate}.float-badge-2{animation:floatBadge 6s ease-in-out 1.5s infinite alternate}.wave-flow{animation:waveShift 10s linear infinite}.sub-font,.title-font{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-font{font-weight:800;letter-spacing:-.5px}.sub-font{font-weight:400;letter-spacing:.2px}.mono-font{font-family:&apos;SFMono-Regular&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,Courier,monospace}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g class="glow-pulse" style="transform-origin:200px 180px"><circle cx="15